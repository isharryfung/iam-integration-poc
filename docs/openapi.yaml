openapi: 3.0.3
info:
  title: IAM Integration Platform API
  version: "1.0.0"
  description: |
    API for the HKUST IAM Integration Platform POC.
    Supports ingestion of identity events from CADS, PeopleSoft (SIS/FMS/HRMS),
    ECM, and JSPM; event status tracking; user sync status queries; and
    real-time access decisions.

    **Authentication:** All endpoints require an `api_key` header.
    The default POC key is `poc-dev-key-1234`.

    **Email domains:** Currently only `@ust.hk` is accepted.
    Future expansion: `@connect.ust.hk`, `@family.ust.hk`.

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Ingestion
    description: Receive identity events from source systems
  - name: Users
    description: Per-user operational queries
  - name: MidPoint
    description: Preview the standardized MidPoint input generated from stored events
  - name: Access
    description: Real-time access decision

# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────────────────────────────────────
  /health:
    get:
      summary: Health check
      description: Returns OK if the backend is running. No auth required.
      operationId: healthCheck
      tags: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ── Ingestion ────────────────────────────────────────────────────────────────
  /api/v1/inbound/events:
    post:
      summary: Ingest a single identity event
      description: |
        Unified ingestion endpoint for CADS, PeopleSoft, ECM, and JSPM.
        The source system is identified via the `X-Source-System` header or
        the `sourceSystem` field in the request body.

        Returns 202 Accepted with an `eventId` for status tracking.
        Returns 200 if the `Idempotency-Key` was already seen (duplicate).
      operationId: ingestEvent
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/XSourceSystem'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPayload'
            examples:
              cads:
                summary: CADS HR event
                value:
                  employeeId: "E12345"
                  employeeEmail: "john.doe@ust.hk"
                  employeeName: "John Doe"
                  department: "Finance Management Office"
                  role: "APPROVER"
                  action: "provision"
              peoplesoft_hrms:
                summary: PeopleSoft table-row event
                value:
                  "Dept": "DAO"
                  "Rank/ Team": "Alumni Team"
                  "User": "dao.alumni.manager"
                  "Role Name": "HKUST ALUM ADMIN DOWNLOAD DATA"
                  "Remarks": "Access to AAS"
                  "Data Level Security": "All alumni"
              ecm:
                summary: ECM access event
                value:
                  userId: "ECM-001"
                  userEmail: "alice.chan@ust.hk"
                  documentClass: "FINANCE_CONTRACTS"
                  role: "READER"
                  action: "provision"
              jspm:
                summary: JSPM project assignment
                value:
                  projectCode: "PROJ-2026-001"
                  userEmail: "bob.lee@ust.hk"
                  projectRole: "PROJECT_MANAGER"
                  action: "assign"
      responses:
        "202":
          description: Event accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        "200":
          description: Duplicate event (idempotency key already seen)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/inbound/events:batch:
    post:
      summary: Ingest a batch of events
      description: |
        Submit multiple events in one request.
        Each event in the `events` array may include an optional `_idempotencyKey` field.
        Returns a summary of accepted and rejected events.
      operationId: ingestBatch
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/XSourceSystem'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/IngestPayload'
      responses:
        "202":
          description: Batch accepted (may include partial failures)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/inbound/events/{eventId}/status:
    get:
      summary: Get event processing status
      description: |
        Returns the current processing lifecycle of a specific event.
        Status values: `received` → `validated` → `sent_to_midpoint` → `success`
        or `failed` → `retrying` → `dead_letter`
      operationId: getEventStatus
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStatus'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  # ── Source-specific aliases (same handler as /events) ──────────────────────
  /api/v1/inbound/cads:
    post:
      summary: Ingest CADS event (alias)
      description: "Alias for `POST /api/v1/inbound/events` with `X-Source-System: CADS`"
      operationId: ingestCads
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPayload'
      responses:
        "202":
          $ref: '#/components/responses/Accepted'

  /api/v1/inbound/peoplesoft:
    post:
      summary: Ingest PeopleSoft event (alias)
      description: "Alias for `POST /api/v1/inbound/events` with `X-Source-System: PEOPLESOFT`"
      operationId: ingestPeopleSoft
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPayload'
            examples:
              peoplesoft_row:
                summary: Raw PeopleSoft export row
                value:
                  "Dept": "ARO"
                  "Rank/ Team": "Prog Reg Team"
                  "User": "ar.registrar"
                  "Role Name": "HKUST STU SERVICE CENTER"
                  "Remarks": "Access to SIS"
                  "Data Level Security": "All students"
              peoplesoft_canonical:
                summary: Canonical PeopleSoft payload
                value:
                  meta:
                    sourceSystem: "PEOPLESOFT"
                    operation: "ASSIGN_ENTITLEMENT"
                  identity:
                    email: "ar.registrar@ust.hk"
                    userType: "staff"
                  entitlement:
                    application: "SIS"
                    action: "provision"
                    roleName: "HKUST STU SERVICE CENTER"
                    departmentOrProject: "ARO"
                  attributes:
                    rankOrTeam: "Prog Reg Team"
                    remarks: "Access to SIS"
                    dataLevelSecurity:
                      scope: "ALL_STUDENTS"
                      label: "All students"
      responses:
        "202":
          $ref: '#/components/responses/Accepted'

  /api/v1/inbound/ecm:
    post:
      summary: Ingest ECM event (alias)
      description: "Alias for `POST /api/v1/inbound/events` with `X-Source-System: ECM`"
      operationId: ingestECM
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPayload'
      responses:
        "202":
          $ref: '#/components/responses/Accepted'

  /api/v1/inbound/jspm:
    post:
      summary: Ingest JSPM event (alias)
      description: "Alias for `POST /api/v1/inbound/events` with `X-Source-System: JSPM`"
      operationId: ingestJSPM
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPayload'
      responses:
        "202":
          $ref: '#/components/responses/Accepted'

  # ── User endpoints ──────────────────────────────────────────────────────────
  /api/v1/users/{email}/sync-status:
    get:
      summary: Get user sync status
      description: |
        Returns the latest sync and provisioning summary for a user.
        Aggregated from all source systems that have contributed events.
      operationId: getUserSyncStatus
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/EmailPath'
      responses:
        "200":
          description: User sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/users/{email}/events:
    get:
      summary: Get user event history
      description: |
        Returns paginated event history for a user.
        Filter by source system or processing status.
      operationId: getUserEvents
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/EmailPath'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: sourceSystem
          in: query
          schema:
            type: string
            enum: [CADS, PEOPLESOFT, ECM, JSPM]
        - name: status
          in: query
          schema:
            type: string
            enum: [received, validated, validation_failed, sent_to_midpoint, success, failed, retrying, dead_letter]
      responses:
        "200":
          description: User event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:   { type: string }
                  total:   { type: integer }
                  page:    { type: integer }
                  limit:   { type: integer }
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventStatus'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/{email}/replay:
    post:
      summary: Replay failed event (admin)
      description: |
        Replay the most recent failed, dead-letter, or validation-failed event for the user.
        Optionally specify a specific `eventId` in the request body to replay that event.
        Creates a new InboundEvent from the original raw payload.
      operationId: replayUserEvent
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/EmailPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: string
                  description: Specific event ID to replay (optional; defaults to latest failed)
      responses:
        "202":
          description: Replay initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  # ── MidPoint preview endpoints ──────────────────────────────────────────────
  /api/v1/midpoint/events:
    get:
      summary: Search events for MidPoint preview
      description: |
        Lightweight event query for the MidPoint preview UI.
        Supports search by email, source system, or exact event ID.
      operationId: listMidpointPreviewEvents
      tags: [MidPoint]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - name: email
          in: query
          schema:
            type: string
            format: email
        - name: sourceSystem
          in: query
          schema:
            type: string
            enum: [CADS, PEOPLESOFT, ECM, JSPM]
        - name: eventId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Matching events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MidpointEventList'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/midpoint/preview:
    get:
      summary: Preview transformed MidPoint JSON by event ID
      description: |
        Loads an existing inbound event, returns the original source payload,
        the standardized MidPoint input JSON, and validation details.
      operationId: getMidpointPreviewByEventId
      tags: [MidPoint]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - name: eventId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: MidPoint preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MidpointPreviewResponse'
              examples:
                peoplesoft:
                  summary: PeopleSoft source row and transformed canonical JSON
                  value:
                    eventId: "ps-7fbdd1fb-df5d-4db2-b447-b6579400dc32"
                    sourceSystem: "PEOPLESOFT"
                    email: "dao.alumni.manager@ust.hk"
                    status: "success"
                    receivedAt: "2026-07-03T03:00:00.000Z"
                    processedAt: "2026-07-03T03:00:00.100Z"
                    transformStatus: "success"
                    sourcePayload:
                      "Dept": "DAO"
                      "Rank/ Team": "Alumni Team"
                      "User": "dao.alumni.manager"
                      "Role Name": "HKUST ALUM ADMIN DOWNLOAD DATA"
                      "Remarks": "Access to AAS"
                      "Data Level Security": "All alumni"
                    midpointInput:
                      meta:
                        eventId: "ps-7fbdd1fb-df5d-4db2-b447-b6579400dc32"
                        eventTime: "2026-07-03T03:00:00.000Z"
                        sourceSystem: "PEOPLESOFT"
                        correlationId: "3ca1f6a1-71df-4f29-a7f0-e420ab56b619"
                        idempotencyKey: "peoplesoft|dao.alumni.manager@ust.hk|DAO|HKUST ALUM ADMIN DOWNLOAD DATA"
                        operation: "ASSIGN_ENTITLEMENT"
                      identity:
                        email: "dao.alumni.manager@ust.hk"
                        displayName: null
                        userType: "staff"
                        staffId: null
                        studentId: null
                      entitlement:
                        application: "AAS"
                        action: "provision"
                        roleName: "HKUST ALUM ADMIN DOWNLOAD DATA"
                        departmentOrProject: "DAO"
                        department: "DAO"
                        validFrom: null
                        validUntil: null
                      attributes:
                        rankOrTeam: "Alumni Team"
                        remarks: "Access to AAS"
                        dataLevelSecurity:
                          scope: "ALL_ALUMNI"
                          label: "All alumni"
                    validation:
                      isValid: true
                      status: "pass"
                      missingFields: []
                      invalidFields: []
                      errors: []
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/midpoint/preview/by-email:
    get:
      summary: Preview transformed MidPoint JSON by email
      description: |
        Returns the latest stored event for the given email by default.
        Optionally combine with `sourceSystem` or `eventId` to narrow the lookup.
      operationId: getMidpointPreviewByEmail
      tags: [MidPoint]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
        - name: latest
          in: query
          schema:
            type: boolean
            default: true
        - name: sourceSystem
          in: query
          schema:
            type: string
            enum: [CADS, PEOPLESOFT, ECM, JSPM]
        - name: eventId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: MidPoint preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MidpointPreviewResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  # ── Access ──────────────────────────────────────────────────────────────────
  /user/access:
    get:
      summary: Access decision
      description: |
        Returns a real-time access decision for a user against a specific service.
        Used by application gateways during login/authorization.

        User identity can be provided via:
        - `?email=user@ust.hk` query parameter
        - `x-user-email` request header
      operationId: getAccess
      tags: [Access]
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - name: service_id
          in: header
          required: true
          description: Target service being checked (e.g. ECM, PORTAL)
          schema:
            type: string
        - name: email
          in: query
          description: User email to evaluate
          schema:
            type: string
            format: email
        - name: x-user-email
          in: header
          description: Alternative user email via header (used if no ?email= param)
          schema:
            type: string
      responses:
        "200":
          description: Access decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecision'
              example:
                email: user@ust.hk
                serviceId: ECM
                decision: ALLOW
                status: ACTIVE
                validity:
                  start: "2026-07-01T00:00:00Z"
                  end: null
                  isNowValid: true
                attributes:
                  role: APPROVER
                  department: FMO
                  dataSecurityLevel: L1
                sourceOfTruth: IAM_POC
                sourceSystems: [CADS, ECM]
                checkedAt: "2026-07-02T12:00:00Z"
                correlationId: "uuid-here"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

# ─────────────────────────────────────────────────────────────────────────────
components:

  parameters:
    ApiKey:
      name: api_key
      in: header
      required: true
      description: API key for authentication
      schema:
        type: string
        example: poc-dev-key-1234

    XSourceSystem:
      name: X-Source-System
      in: header
      required: false
      schema:
        type: string
        enum: [CADS, PEOPLESOFT, ECM, JSPM]

    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique key to prevent duplicate processing
      schema:
        type: string

    EmailPath:
      name: email
      in: path
      required: true
      schema:
        type: string
        format: email
        example: user@ust.hk

  schemas:
    IngestPayload:
      type: object
      description: |
        Flexible payload — field names vary by source system.
        The platform normalises each source into a canonical format.
      additionalProperties: true
      example:
        employeeEmail: "john.doe@ust.hk"
        employeeId: "E12345"
        action: "provision"

    IngestResponse:
      type: object
      properties:
        message:       { type: string }
        eventId:       { type: string }
        jobId:         { type: string }
        status:        { type: string }
        correlationId: { type: string }

    BatchResponse:
      type: object
      properties:
        message:       { type: string }
        jobId:         { type: string }
        correlationId: { type: string }
        summary:
          type: object
          properties:
            total:    { type: integer }
            accepted: { type: integer }
            rejected: { type: integer }
        accepted:
          type: array
          items:
            type: object
            properties:
              index:     { type: integer }
              eventId:   { type: string }
              duplicate: { type: boolean }
        rejected:
          type: array
          items:
            type: object
            properties:
              index:  { type: integer }
              reason: { type: string }

    EventStatus:
      type: object
      properties:
        eventId:       { type: string }
        jobId:         { type: string }
        sourceSystem:  { type: string }
        status:
          type: string
          enum: [received, validated, validation_failed, sent_to_midpoint, success, failed, retrying, dead_letter]
        correlationId: { type: string }
        identity:
          type: object
          properties:
            email:       { type: string }
            emailDomain: { type: string }
            displayName: { type: string }
            userType:    { type: string }
        validationErrors:
          type: array
          items: { type: string }
        retryCount:    { type: integer }
        lastError:     { type: string }
        receivedAt:    { type: string, format: date-time }
        processedAt:   { type: string, format: date-time }

    SyncStatus:
      type: object
      properties:
        email:                { type: string }
        emailDomain:          { type: string }
        displayName:          { type: string }
        userType:             { type: string }
        lastSourceSystem:     { type: string }
        lastEventId:          { type: string }
        lastEventTime:        { type: string, format: date-time }
        lastProcessingStatus: { type: string }
        lastSuccessAt:        { type: string, format: date-time }
        lastFailureAt:        { type: string, format: date-time }
        lastError:            { type: string }
        lastMidpointStatus:   { type: string }
        totalEventsReceived:  { type: integer }
        totalEventsFailed:    { type: integer }
        activeFlags:
          type: object
          properties:
            hasRecentFailure: { type: boolean }
            hasPendingRetry:  { type: boolean }
            isInDeadLetter:   { type: boolean }
        sourceContributions:
          type: object
          additionalProperties:
            type: object
            properties:
              lastEventAt: { type: string, format: date-time }
              lastStatus:  { type: string }
              psModule:    { type: string }

    ReplayResponse:
      type: object
      properties:
        message:         { type: string }
        originalEventId: { type: string }
        replayEventId:   { type: string }
        status:          { type: string }
        correlationId:   { type: string }

    MidpointEventSummary:
      type: object
      properties:
        eventId:      { type: string }
        sourceSystem: { type: string, enum: [CADS, PEOPLESOFT, ECM, JSPM] }
        email:        { type: string, nullable: true }
        status:       { type: string }
        action:       { type: string, nullable: true }
        role:         { type: string, nullable: true }
        receivedAt:   { type: string, format: date-time }
        processedAt:  { type: string, format: date-time, nullable: true }

    MidpointEventList:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        events:
          type: array
          items:
            $ref: '#/components/schemas/MidpointEventSummary'

    MidpointValidationIssue:
      type: object
      properties:
        field:   { type: string }
        type:    { type: string, enum: [missing, invalid] }
        message: { type: string }

    MidpointValidationResult:
      type: object
      properties:
        isValid: { type: boolean }
        status:  { type: string, enum: [pass, fail] }
        missingFields:
          type: array
          items: { type: string }
        invalidFields:
          type: array
          items: { type: string }
        errors:
          type: array
          items:
            $ref: '#/components/schemas/MidpointValidationIssue'

    MidpointMeta:
      type: object
      properties:
        eventId:        { type: string }
        eventTime:      { type: string, format: date-time }
        sourceSystem:   { type: string, enum: [CADS, PEOPLESOFT, ECM, JSPM] }
        correlationId:  { type: string, nullable: true }
        idempotencyKey: { type: string, nullable: true }
        operation:
          type: string
          enum: [CREATE_OR_UPDATE_IDENTITY, ASSIGN_ENTITLEMENT, REMOVE_ENTITLEMENT, SYNC_PROJECT_MEMBERSHIP]

    MidpointIdentity:
      type: object
      properties:
        email:       { type: string }
        displayName: { type: string, nullable: true }
        userType:    { type: string }
        staffId:     { type: string, nullable: true }
        studentId:   { type: string, nullable: true }

    MidpointEntitlement:
      type: object
      properties:
        application:   { type: string }
        action:        { type: string, nullable: true }
        roleName:      { type: string, nullable: true }
        departmentOrProject: { type: string, nullable: true }
        department:    { type: string, nullable: true }
        validFrom:     { type: string, format: date-time, nullable: true }
        validUntil:    { type: string, format: date-time, nullable: true }
        documentClass: { type: string, nullable: true }
        projectCode:   { type: string, nullable: true }

    MidpointAttributes:
      type: object
      properties:
        rankOrTeam: { type: string, nullable: true }
        remarks: { type: string, nullable: true }
        dataLevelSecurity:
          type: object
          additionalProperties: true

    MidpointInput:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/MidpointMeta'
        identity:
          $ref: '#/components/schemas/MidpointIdentity'
        entitlement:
          $ref: '#/components/schemas/MidpointEntitlement'
        attributes:
          $ref: '#/components/schemas/MidpointAttributes'

    MidpointPreviewResponse:
      type: object
      properties:
        eventId:         { type: string }
        sourceSystem:    { type: string, enum: [CADS, PEOPLESOFT, ECM, JSPM] }
        email:           { type: string, nullable: true }
        status:          { type: string }
        receivedAt:      { type: string, format: date-time }
        processedAt:     { type: string, format: date-time, nullable: true }
        transformStatus: { type: string, example: success }
        sourcePayload:
          type: object
          additionalProperties: true
        midpointInput:
          $ref: '#/components/schemas/MidpointInput'
        validation:
          $ref: '#/components/schemas/MidpointValidationResult'

    AccessDecision:
      type: object
      properties:
        email:     { type: string }
        serviceId: { type: string }
        decision:
          type: string
          enum: [ALLOW, DENY]
        status:    { type: string }
        validity:
          type: object
          properties:
            start:      { type: string, format: date-time, nullable: true }
            end:        { type: string, format: date-time, nullable: true }
            isNowValid: { type: boolean }
        attributes:
          type: object
          properties:
            role:               { type: string }
            department:         { type: string }
            dataSecurityLevel:  { type: string }
        sourceOfTruth:  { type: string }
        sourceSystems:
          type: array
          items: { type: string }
        checkedAt:     { type: string, format: date-time }
        correlationId: { type: string }

    Error:
      type: object
      properties:
        error:  { type: string }
        detail: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid api_key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Request was valid but the payload could not be transformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Accepted:
      description: Event accepted for processing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestResponse'
